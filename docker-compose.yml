services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    # Local dev only: the Dockerfile's own CMD dropped --reload (unsafe for
    # the same image's production use on Render) — restore it here so the
    # ./backend bind mount below still hot-reloads.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      # Server-side geocoding fallback. Reuses the Maps key by default; for
      # production prefer a separate key restricted to the Geocoding API (no
      # HTTP-referrer restriction, since server calls have no referrer).
      - GEOCODING_API_KEY=${GEOCODING_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}
      # Google Sign-In (token verification). Set in root .env.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Anthropic (NL query → data grid, /api/ai/query). Set in root .env.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # fixes103: all email goes through the email-service microservice
      # running on the host at :8000. Inside this container "localhost" is the
      # container itself, so the URL points at the host instead (the root
      # .env's localhost value is for running the backend outside Docker).
      # The token comes from the root .env — never commit its value. The
      # backend refuses to start if either is empty.
      - EMAIL_SERVICE_URL=http://host.docker.internal:8000
      - EMAIL_SERVICE_TOKEN=${EMAIL_SERVICE_TOKEN:-}
    # host.docker.internal is built into Docker Desktop; this makes it resolve
    # on a plain Linux Docker engine too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      # Server-side-only (generateMetadata, etc.): NEXT_PUBLIC_API_URL above is
      # host-relative and unreachable from inside this container — reach the
      # backend by its compose service name instead. Not set in production,
      # where the frontend and backend aren't on the same docker network;
      # lib/serverApi.ts falls back to NEXT_PUBLIC_API_URL there.
      - INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Cloudinary signed upload (org logo): the browser only needs the public
      # cloud name to gate/perform the upload. The API key/secret stay in
      # backend/.env — the backend signs each upload (see routers/uploads.py).
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      # File-watching across the Windows→Linux bind mount doesn't deliver inotify
      # events, so Next's dev server misses edits/new routes (serving stale code).
      # Force polling so HMR + route discovery work reliably.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend_data:
