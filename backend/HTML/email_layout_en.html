<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>[[title]]</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&amp;display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;padding:0;background:#f5f6f9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="ltr" style="background:#f5f6f9;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="height:4px;line-height:4px;font-size:0;background:#1695c0;">&nbsp;</td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 32px 4px;">
                <img src="{{logo_url}}" height="72" alt="" style="display:block;height:72px;width:auto;max-width:220px;border:0;outline:none;" />
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 32px;font-family:'Heebo',Arial,Helvetica,sans-serif;font-size:15px;line-height:1.7;color:#334155;text-align:left;">
[[content]]
              </td>
            </tr>
            <tr>
              <td style="padding:14px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;font-family:'Heebo',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#64748b;text-align:left;">
                [[card_footer]]
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
            <tr>
              <td align="center" style="padding:18px 24px 0;font-family:'Heebo',Arial,Helvetica,sans-serif;font-size:12px;color:#94a3b8;">
                <img src="{{system_logo_url}}" height="28" alt="" style="display:inline-block;vertical-align:middle;height:28px;width:auto;border:0;" />
                <span style="display:inline-block;vertical-align:middle;padding-left:8px;">
                  Built by <a href="mailto:zvi.naiman@gmail.com" style="color:#1695c0;text-decoration:none;">zvi.naiman@gmail.com</a>
                </span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
