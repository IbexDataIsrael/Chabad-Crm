version: '3.8'

services:
  sandbox:
    image: python:3.12-slim
    container_name: python_ai_sandbox
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    command: sh -c "pip install anthropic && python query.py && tail -f /dev/null"
